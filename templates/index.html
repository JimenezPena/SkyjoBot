<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyjo AI - Modo Visual</title>
    <style>
        :root {
            --bg-color: #1e272e;
            --card-neg: #1b365d;   /* -2, -1: Azul Oscuro */
            --card-zero: #00a3e0;  /* 0: Cyan */
            --card-low: #2e7d32;   /* 1-4: Verde */
            --card-mid: #fbc02d;   /* 5-8: Amarillo */
            --card-high: #c62828;  /* 9-12: Rojo */
            --card-back: #2c3e50;  /* Carta Oculta */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 15px;
        }

        h1 { margin: 5px 0 15px 0; font-size: 1.8rem; }

	.game-container {
	    display: flex;
	    flex-direction: column;
	    align-items: center;
	    gap: 20px;
	    width: 100%;
	    max-width: 760px;
	}

        /* TABLEROS */
        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        
	.boards-row {
	    display: flex;
	    justify-content: center;
	    align-items: flex-start;
	    gap: 20px;
	    width: 100%;
	    flex-wrap: wrap;   /* en pantallas estrechas se apilan */
	}

	.board-wrapper {
	    display: flex;
	    flex-direction: column;
	    align-items: center;
	}
	
        .player-label {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .vis-pts {
            font-size: 0.75rem;
            color: #aaa;
            font-weight: normal;
        }

        /* CARTAS */
        .card {
            width: 65px;
            height: 95px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid #ffffff33;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease, border-color 0.2s ease;
        }

        .card:hover { transform: scale(1.05); }

        /* Colores Skyjo */
        .card-neg { background-color: var(--card-neg); color: #fff; }
        .card-zero { background-color: var(--card-zero); color: #fff; }
        .card-low { background-color: var(--card-low); color: #fff; }
        .card-mid { background-color: var(--card-mid); color: #222; }
        .card-high { background-color: var(--card-high); color: #fff; }
        .card-hidden { 
            background-color: var(--card-back); 
            color: #7f8c8d;
            border: 2px dashed #ffffff55;
        }
        .card-removed { visibility: hidden; }
        
        /* Transición suave para el cambio de turno */
	.board-wrapper {
	    padding: 8px;
	    border-radius: 12px;
	    transition: all 0.3s ease;
	    border: 2px solid transparent;
	}

	/* Estilo para el jugador en turno */
	.board-wrapper.active-turn {
	    background-color: rgba(39, 174, 96, 0.15); /* Fondo verde tenue */
	    border-color: #27ae60;                      /* Borde verde brillante */
	    box-shadow: 0 0 12px rgba(39, 174, 96, 0.4);
	}

	.board-wrapper.active-turn .player-label {
	    color: #2ec771;
	    font-weight: bold;
	}

        /* ZONA CENTRAL (MAZOS Y ACCIONES) */
        .middle-zone {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 12px;
        }

	.hand-wrapper {
	    display: flex;
	    align-items: flex-end;
	    gap: 8px;
	}
	
	.btn-discard-slot {
	    width: 80px;
	    height: 100px;
	    background-color: #c62828;
	    color: white;
	    border: 2px solid #ffffff99;
	    border-radius: 8px;
	    cursor: pointer;
	    display: flex;
	    flex-direction: column;
	    align-items: center;
	    justify-content: center;
	    font-size: 1.8rem;
	    padding: 0;
	    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3); 
	    transition: transform 0.1s ease, background-color 0.2s ease;
	}

	.btn-discard-slot span {
	    font-size: 0.65rem;
	    font-weight: bold;
	    text-transform: uppercase;
	    margin-top: 2px;
	}

	.btn-discard-slot:hover {
	    background-color: #e53935;
	    transform: scale(1.05);
	}

	@keyframes shake {
	    0%, 100% { transform: translateX(0); }
	    20%, 60% { transform: translateX(-10px); }
	    40%, 80% { transform: translateX(10px); }
	}

	.defeat-effect {
	    animation: shake 0.5s ease-in-out;
	}
	
	/* Ajuste específico para móviles dentro de tu media query @media (max-width: 600px) */
	@media (max-width: 600px) {
	    .btn-discard-slot {
		width: 44px;
		height: 66px;
		font-size: 1.1rem;
		border-radius: 5px;
	    }
	    
	    .btn-discard-slot span {
		font-size: 0.5rem;
	    }
	}

        .deck-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .deck-title { font-size: 0.85rem; color: #aaa; text-transform: uppercase; }

        /* PANEL DE ACCIONES / MENSAJES */
        .status-panel {
            text-align: center;
            font-size: 1.1rem;
            min-height: 40px;
        }

        .btn-action {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-action:hover { background-color: #2ec771; }
        .btn-action:disabled { background-color: #7f8c8d; cursor: not-allowed; }

        .selector-bots {
            font-size: 0.9rem;
            color: #ccc;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .selector-bots select {
            background: #2c3e50;
            color: #fff;
            border: 1px solid #ffffff44;
            border-radius: 6px;
            padding: 4px 6px;
        }

        .link-vuelta {
            color: #aaa;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .link-vuelta:hover { text-decoration: underline; }

        /* Adaptación para pantallas pequeñas / móviles verticales */
	@media (max-width: 600px) {
	    html, body {
		/* Permite scroll vertical únicamente si la pantalla es excesivamente corta */
		overflow-y: auto;
		height: auto;
	    }
	    
	    body {
		padding: 5px;
	    }

	    h1 {
		font-size: 1.2rem;
		margin: 2px 0 6px 0;
	    }

	    .game-container {
		gap: 8px;
	    }

	    .boards-row {
		gap: 8px;
	    }

	    /* Reducimos el padding y el espacio entre cartas del tablero */
	    .board {
		gap: 5px;
		padding: 6px;
	    }

	    /* Reducimos el tamaño de las cartas */
	    .card {
		width: 44px;
		height: 66px;
		font-size: 1.2rem;
		border-radius: 6px;
	    }

	    /* Ajustes para los botones de acción */
	    .btn-action {
		padding: 8px 14px;
		font-size: 0.85rem;
		margin-top: 5px;
		width: 90%; /* Para asegurarse de que no sobresalga horizontalmente */
		max-width: 300px;
	    }

	    /* Reducimos el padding de la zona central */
	    .middle-zone {
		padding: 6px;
	    }

	    .status-panel {
		font-size: 0.90rem;
		min-height: 30px;
	    }
	}
	
    </style>
</head>
<!-- Librería para el efecto de confeti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<body>

    <h1>Skyjo: tú contra un bot</h1>

	<div class="game-container">
        <!-- Selector de nivel del bot -->
        <div class="selector-bots">
            🤖 Bots: <select id="sel-1"></select>
            <span class="link-vuelta">(se aplica al reiniciar)</span>
        </div>

	    <!-- FILA DE TABLEROS: tú a la izquierda, bot a la derecha -->
	    <div class="boards-row">
		<div id="wrapper-ia" class="board-wrapper">
		    <div class="player-label" id="label-ia">🤖 Bot  <span class="vis-pts">(0 visibles)</span></div>
		    <div id="board-ia" class="board"></div>
		</div>

		<div id="wrapper-human" class="board-wrapper">
		    <div class="player-label" id="label-human">👤 Tú <span class="vis-pts">(0 visibles)</span></div>
		    <div id="board-human" class="board"></div>
		</div>
	    </div>

	    <!-- ZONA CENTRAL -->
	    <div class="middle-zone">
		<div class="deck-container">
		    <span class="deck-title">Mazo</span>
		    <div id="deck-draw" class="card card-hidden" onclick="robarMazo()">🂠</div>
		</div>

		<div class="hand-wrapper">
		    <div class="deck-container">
		    	<span class="deck-title">En Mano</span>
		    	<div id="card-hand" class="card card-hidden">-</div>
		    </div>
		
		    <button id="btn-descartar" class="btn-discard-slot" style="display:none" onclick="iniciarDescarte()" title="Descartar y voltear">
            🗑️    <br><span>Descartar</span>
        	    </button>

		</div>

		<div class="deck-container">
		    <span class="deck-title">Descarte</span>
		    <div id="deck-discard" class="card card-hidden" onclick="tomarDescarte()">-</div>
		</div>
	    </div>

	    <!-- PANEL DE ESTADO -->
	    <div class="status-panel" id="status-msg">Cargando partida...</div>
	  
	    <button class="btn-action" onclick="nuevaPartida()">Reiniciar Partida</button>
	    <a href="/cuatro" class="link-vuelta">Jugar 1 contra 3 bots (4 jugadores)</a>
	</div>

    <script>
	let gameState = null;
	let partidaId = 0;              // permite cancelar el bucle de la IA si reinicias
	const IA_DELAY_MS = 2000;       // retraso entre acciones de la IA
	let modoDescarte = false;       // controla si estamos eligiendo qué carta voltear
    let nivelIaActual = "1";        // nivel actual seleccionado

	const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

	async function turnoIA(id) {
	    while (gameState && !gameState.game_over && gameState.turno_actual === 1) {
		await sleep(IA_DELAY_MS);
		if (id !== partidaId) return;   // se reinició la partida mientras esperaba

		const res = await fetch('/api/ia_step', { method: 'POST' });
		if (!res.ok) return;
		const data = await res.json();
		if (id !== partidaId) return;

		renderGame(data);
	    }
	}
	
        function getCardColorClass(val, vis) {
            if (vis === -1) return 'card-removed';
            if (vis === 0) return 'card-hidden';
            if (val < 0) return 'card-neg';
            if (val === 0) return 'card-zero';
            if (val <= 4) return 'card-low';
            if (val <= 8) return 'card-mid';
            return 'card-high';
        }

        function ptsVisibles(tab) {
            let s = 0;
            for (const fila of tab) for (const [v, vis] of fila) if (vis === 1) s += v;
            return s;
        }

        function renderGame(state) {
            gameState = state;
            if (state.niveles && state.niveles.length > 0) {
                nivelIaActual = state.niveles[0];
            }

	    // Resaltar de quién es el turno
	    const wrapperHuman = document.getElementById('wrapper-human');
	    const wrapperIA = document.getElementById('wrapper-ia');

	    if (state.turno_actual === 0) {
		wrapperHuman.classList.add('active-turn');
		wrapperIA.classList.remove('active-turn');
	    } else {
		wrapperIA.classList.add('active-turn');
	    	wrapperHuman.classList.remove('active-turn');
	   }
	   
	   modoDescarte = false; // Resetear el modo al cargar un nuevo estado
	   
	   // Un jugador puede descartar si está en la fase 2 y tiene acciones válidas del 14 al 25
	   const puedeDescartar = state.turno_actual === 0 && state.fase_turno === 2 && state.action_mask.slice(14, 26).some(m => m);
	   document.getElementById('btn-descartar').style.display = puedeDescartar ? 'inline-block' : 'none';
	   
            // 1. Render Tablero IA
            const boardIA = document.getElementById('board-ia');
            boardIA.innerHTML = '';
            for (let f = 0; f < 3; f++) {
                for (let c = 0; c < 4; c++) {
                    const val = state.tableros[1][f][c][0];
                    const vis = state.tableros[1][f][c][1];
                    const cardDiv = document.createElement('div');
                    cardDiv.className = `card ${getCardColorClass(val, vis)}`;
                    cardDiv.innerText = vis === 1 ? val : (vis === 0 ? '?' : '');
                    boardIA.appendChild(cardDiv);
                }
            }
            let txtIa = `🤖 Bot (${nivelIaActual}) <span class="vis-pts">(${ptsVisibles(state.tableros[1])} visibles`;
            if (state.game_over) txtIa += ` · ${state.puntos[1]} pts`;
            document.getElementById('label-ia').innerHTML = txtIa + ')</span>';

            // 2. Render Tablero Humano
            const boardHuman = document.getElementById('board-human');
            boardHuman.innerHTML = '';
            for (let f = 0; f < 3; f++) {
                for (let c = 0; c < 4; c++) {
                    const idx = f * 4 + c;
                    const val = state.tableros[0][f][c][0];
                    const vis = state.tableros[0][f][c][1];
                    const cardDiv = document.createElement('div');
                    cardDiv.className = `card ${getCardColorClass(val, vis)}`;
                    cardDiv.innerText = vis === 1 ? val : (vis === 0 ? '?' : '');
                    cardDiv.onclick = () => hacerAccionCasilla(idx);
                    boardHuman.appendChild(cardDiv);
                }
            }
            let txtHum = `👤 Tú <span class="vis-pts">(${ptsVisibles(state.tableros[0])} visibles`;
            if (state.game_over) txtHum += ` · ${state.puntos[0]} pts`;
            document.getElementById('label-human').innerHTML = txtHum + ')</span>';

            // 3. Render Descarte y Carta en Mano
            const cardDiscard = document.getElementById('deck-discard');
            if (state.top_descarte !== null) {
                cardDiscard.className = `card ${getCardColorClass(state.top_descarte, 1)}`;
                cardDiscard.innerText = state.top_descarte;
            }

            const cardHand = document.getElementById('card-hand');
            if (state.carta_en_mano !== null) {
                cardHand.className = `card ${getCardColorClass(state.carta_en_mano, 1)}`;
                cardHand.innerText = state.carta_en_mano;
            } else {
                cardHand.className = 'card card-hidden';
                cardHand.innerText = '-';
            }

	    // 4. Mensajes de Estado y Efectos de Fin de Partida
	    const msg = document.getElementById('status-msg');

	    if (state.game_over) {
	    	const humanoGana = state.puntos[0] < state.puntos[1]; // En Skyjo gana quien tenga MENOS puntos
	    	const empate = state.puntos[0] === state.puntos[1];

	    	if (humanoGana) {
		    msg.innerHTML = `🎉 <b>¡VICTORIA!</b> 🎉<br>Tú: ${state.puntos[0]} pts | Bot: ${state.puntos[1]} pts`;
		
		    // Efecto de Confeti para la victoria
		    confetti({
		    	particleCount: 100,
		    	spread: 70,
		    	origin: { y: 0.6 }
		    });
	    	} else if (empate) {
		    msg.innerHTML = `🤝 <b>¡EMPATE!</b><br>Tú: ${state.puntos[0]} pts | Bot: ${state.puntos[1]} pts`;
	    	} else {
		    msg.innerHTML = `💀 <b>HAS PERDIDO</b><br>Tú: ${state.puntos[0]} pts | Bot: ${state.puntos[1]} pts`;
		
		    // Efecto de sacudida en el tablero del jugador al perder
		    const boardHumanWrapper = document.getElementById('wrapper-human');
		    boardHumanWrapper.classList.add('defeat-effect');
		    setTimeout(() => boardHumanWrapper.classList.remove('defeat-effect'), 500);
	    	}
	    } else if (state.turno_actual === 0) {
            msg.innerHTML = state.fase_turno === 1 ? 'Tu turno: roba del mazo o toma el descarte' : 'Tu turno: coloca la carta en tu tablero o descártala';
        } else {
            msg.innerHTML = 'Turno de la IA...';
        }
        }

	async function nuevaPartida() {
	    partidaId++;
        const nivelSeleccionado = document.getElementById('sel-1').value;
	    const res = await fetch('/api/reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ niveles: [nivelSeleccionado] })
        });
	    const data = await res.json();
	    renderGame(data);
        turnoIA(partidaId);
	}

	async function enviarAccion(accion) {
	    const res = await fetch('/api/step', {
		method: 'POST',
		headers: { 'Content-Type': 'application/json' },
		body: JSON.stringify({ action: accion })
	    });
	    if (!res.ok) return;
	    const data = await res.json();
	    renderGame(data);

	    // Si ahora le toca a la IA, ejecuta sus acciones una a una con retraso
	    await turnoIA(partidaId);
	}
	
	function iniciarDescarte() {
	    modoDescarte = true;

	    // 1. Mover visualmente la carta de la mano al mazo de descartes
	    const cardHand = document.getElementById('card-hand');
	    const cardDiscard = document.getElementById('deck-discard');

	    cardDiscard.className = cardHand.className;
	    cardDiscard.innerText = cardHand.innerText;

	    cardHand.className = 'card card-hidden';
	    cardHand.innerText = '-';

	    // 2. Ocultar el botón de papelera para evitar doble clic
	    document.getElementById('btn-descartar').style.display = 'none';

	    // 3. Dar feedback visual al usuario en el panel de estado
	    document.getElementById('status-msg').innerHTML = "<b>👇 Haz clic en una de tus cartas ocultas para voltearla</b>";
	}
	
        function tomarDescarte() {
            if (gameState && gameState.turno_actual === 0 && gameState.fase_turno === 1) {
                enviarAccion(0);
            }
        }

        function robarMazo() {
            if (gameState && gameState.turno_actual === 0 && gameState.fase_turno === 1) {
                enviarAccion(1);
            }
        }

        function hacerAccionCasilla(idxCasilla) {
	    if (!gameState || gameState.turno_actual !== 0 || gameState.fase_turno !== 2) return;
	    
	    if (modoDescarte) {
		// Acciones 14 a 25: Descartar la carta robada y revelar la casilla 0 a 11
		const accion = idxCasilla + 14;
		if (gameState.action_mask[accion]) {
		    enviarAccion(accion);
		}
	    } else {
		// Acciones 2 a 13: Reemplazar la casilla 0 a 11 con la carta de la mano
		const accion = idxCasilla + 2;
		if (gameState.action_mask[accion]) {
		    enviarAccion(accion);
		}
	    }
	}

        async function cargarNiveles() {
            try {
                const res = await fetch('/api/niveles');
                if (res.ok) {
                    const d = await res.json();
                    const sel = document.getElementById('sel-1');
                    sel.innerHTML = d.niveles.map(n => `<option value="${n}">${n}</option>`).join('');
                    sel.value = d.por_defecto;
                    nivelIaActual = d.por_defecto;
                }
            } catch (e) {
                // Si el endpoint de niveles no estuviera disponible, dejamos una opción por defecto
                const sel = document.getElementById('sel-1');
                sel.innerHTML = '<option value="1">1</option>';
            }
        }

        // Iniciar al cargar la página cargando los niveles y luego la partida
        cargarNiveles().then(nuevaPartida);
    </script>
</body>
</html>
